# Legacy AWS ECS deployment workflow.
# Sigcore currently deploys via Railway.
# Kept for future AWS migration.
#
# Push triggers were removed on 2026-07-12 because the ECR repo
# `sigcore-prod-backend` was never created in AWS account 094396338769,
# causing every push to main/staging to surface a red "Deploy Sigcore"
# check with no operational impact (Railway serves production traffic).
# When/if the AWS migration resumes, re-add the `push` trigger and
# provision the missing ECR repo + ECS cluster + service.
name: Deploy Sigcore

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sigcore-prod-backend
  ECS_CLUSTER: sigcore-prod-cluster
  ECS_SERVICE: sigcore-prod-backend

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend (ECS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION
        timeout-minutes: 10
